; NavPlotter modem for the Heltec WiFi LoRa 32 V2 (ESP32 + SX1276, 868 MHz).
; The board is only a radio: the Raspberry Pi sends and receives the packets over USB.

[platformio]
default_envs = heltec_wifi_lora_32_V2

[env:heltec_wifi_lora_32_V2]
platform = espressif32@6.5.0
framework = arduino
board = heltec_wifi_lora_32_V2
upload_speed = 460800
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^6.6.0
