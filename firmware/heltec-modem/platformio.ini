; NavPlotter modem for the Heltec WiFi LoRa 32 V2 (ESP32 + SX1276, 868 MHz) and V4 (ESP32-S3 + SX1262 with a
; power amplifier, and its GPS module). The board is only a radio: the Raspberry Pi sends and receives the
; packets over USB; the V4 also passes on its GPS.

[platformio]
default_envs = heltec_wifi_lora_32_V2, heltec_wifi_lora_32_V4

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^6.6.0

[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
upload_speed = 460800

; The V4 has the same ESP32-S3 and radio pins as the V3 (whose board definition is used here) and talks over
; the ESP32-S3's own USB port
[env:heltec_wifi_lora_32_V4]
board = heltec_wifi_lora_32_V3
upload_speed = 921600
build_flags =
	-DBOARD_HELTEC_V4
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
